<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Notes — Ayushman Mondal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <!-- HERO -->
  <div class="hero">
    <p class="hero-label">Academic Notes</p>
    <h1>Academic Notes
      <span class="hero-by">by Ayushman Mondal</span>
    </h1>
  </div>

  <!-- WAVE -->
  <div class="wave-wrap">
    <div class="wave-track">
      <svg viewBox="0 0 1440 28" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="none" stroke="#ffffff" stroke-width="1.4"
          d="M0,14 C120,28 240,0 360,14 C480,28 600,0 720,14 C840,28 960,0 1080,14 C1200,28 1320,0 1440,14"/>
      </svg>
      <svg viewBox="0 0 1440 28" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="none" stroke="#ffffff" stroke-width="1.4"
          d="M0,14 C120,28 240,0 360,14 C480,28 600,0 720,14 C840,28 960,0 1080,14 C1200,28 1320,0 1440,14"/>
      </svg>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" id="tabPosts" onclick="App.switchTab('posts')">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="12" height="3" rx="1.5" fill="currentColor"/>
          <rect x="2" y="6.5" width="9" height="2" rx="1" fill="currentColor" opacity=".6"/>
          <rect x="2" y="10" width="11" height="2" rx="1" fill="currentColor" opacity=".6"/>
          <rect x="2" y="13.5" width="7" height="1.5" rx=".75" fill="currentColor" opacity=".4"/>
        </svg>
        Posts
      </button>
      <button class="tab-btn" id="tabNotes" onclick="App.switchTab('notes')">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <path d="M3 2h7l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4" fill="none"/>
          <path d="M10 2v3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
          <line x1="5" y1="11" x2="9" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>
        </svg>
        Notes
      </button>
    </div>
  </div>

  <!-- APP SHELL -->
  <div class="app">

    <!-- POSTS PANEL -->
    <div id="panelPosts" class="panel">
      <div id="postsContent"></div>
    </div>

    <!-- NOTES PANEL -->
    <div id="panelNotes" class="panel" style="display:none">
      <div class="toolbar">
        <button class="back-btn" id="backBtn" onclick="App.goBack()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </button>
        <span class="level-title" id="levelTitle"></span>
      </div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="notesContent"></div>
    </div>

  </div>

  <!-- DATA -->
  <script src="js/links.js"></script>
  <script src="js/exams.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/posts.js"></script>

  <!-- CORE -->
  <script src="js/icons.js"></script>
  <script src="js/render.js"></script>
  <script src="js/posts-render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
